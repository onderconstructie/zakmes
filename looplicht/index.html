<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Looplicht – Onder Constructie</title>
<meta name="description" content="Maak van je telefoon een fel lichtbaken om gezien te worden als je in het donker loopt of wandelt.">
    <meta name="oc:groep" content="zakmes">
    <meta name="oc:labels" content="veiligheid">
    <meta name="oc:kort" content="Gezien worden als je in het donker wandelt">
    <meta name="oc:volgorde" content="130">
    <meta name="oc:opslag" content="ll-color, ll-mode">
    <meta name="oc:achtergrond" content="nee">
<meta name="theme-color" content="#06070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Looplicht">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' fill='none' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='20' cy='20' r='18' fill='%23f8fafc' stroke='%23e2e8f0' stroke-width='1.5'/%3E%3Crect x='15' y='9' width='10' height='22' rx='2.5' stroke='%2364748b'/%3E%3Crect x='17.5' y='12' width='5' height='16' rx='1' fill='%2310b981'/%3E%3Cpath d='M11.5 14.5L9 13M11.5 20H8.5M11.5 25.5L9 27M28.5 14.5L31 13M28.5 20h3M28.5 25.5L31 27' stroke='%2310b981'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root{
    --bg:#06070b; --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.1);
    --line:rgba(255,255,255,.09); --text:#f5f7fb; --muted:rgba(245,247,251,.66);
    --c:#FFE600; --ease:cubic-bezier(.22,1,.36,1);
    --sans:'DM Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);overscroll-behavior:none;font-family:var(--sans);overflow-x:clip;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
  :focus-visible{outline:2px solid #34d399;outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* Sfeer: gloed in de gekozen kleur + fijn raster als nachtelijke grond */

  body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);background-size:22px 22px;
    -webkit-mask-image:linear-gradient(to bottom, transparent, #000 30%, #000 60%, transparent);
            mask-image:linear-gradient(to bottom, transparent, #000 30%, #000 60%, transparent)}

  #app{position:relative;z-index:1;height:100dvh;max-width:460px;margin:0 auto;display:flex;flex-direction:column;
    padding:calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
    transition:opacity .5s var(--ease), transform .6s var(--ease), visibility 0s}
  /* Onzichtbaar = ook niet bereikbaar met Tab */
  body.lit #app{opacity:0;transform:scale(.94);visibility:hidden;transition:opacity .5s var(--ease), transform .6s var(--ease), visibility 0s .5s}

  /* Kopregel */
  .top{display:flex;align-items:center;gap:8px}
  .crumb{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:.85rem;color:var(--muted);text-decoration:none;padding:0 8px 0 4px;transition:color .2s}
  .crumb:hover{color:var(--text)}
  .crumb svg{width:16px;height:16px}
  .top .sp{flex:1}
  .chip{display:flex;align-items:center;gap:7px;height:44px;padding:0 14px;border-radius:999px;font-size:.85rem;
    font-weight:600;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    transition:background .25s}
  .chip:active{background:var(--glass-2)}
  .chip svg{width:16px;height:16px}
  .chip.icon{width:44px;padding:0;justify-content:center}
  #installChip{display:none}

  /* Podium met de bol */
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:0}
  .orbwrap{position:relative;width:min(58vw,34vh,260px);aspect-ratio:1}
  .orbwrap::before,.orbwrap::after{content:"";position:absolute;inset:0;border-radius:50%;
    border:1.5px solid var(--c);opacity:0;animation:halo 3.2s var(--ease) infinite;pointer-events:none;z-index:0}
  .orbwrap::after{animation-delay:1.6s}
  @keyframes halo{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.42);opacity:0}}
  #orb{position:absolute;inset:0;border-radius:50%;z-index:1;
    background:radial-gradient(circle at 34% 28%, #fff 0%, color-mix(in srgb,var(--c) 70%,#fff) 16%, var(--c) 46%, color-mix(in srgb,var(--c) 82%,#000) 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.15) inset, 0 -18px 40px -10px rgba(0,0,0,.25) inset,
      0 0 36px 2px color-mix(in srgb,var(--c) 55%,transparent);
    transition:background .6s var(--ease), box-shadow .6s var(--ease), transform .4s var(--ease), opacity .12s}
  .glow{position:absolute;inset:-55%;border-radius:50%;pointer-events:none;z-index:0;
    background:radial-gradient(circle, color-mix(in srgb,var(--c) 42%,transparent) 0%, color-mix(in srgb,var(--c) 14%,transparent) 32%, transparent 68%);
    transition:background .6s var(--ease), opacity .12s}
  .orbwrap:has(#orb.off) .glow{opacity:.25}
  #orb:active{transform:scale(.95)}
  #orb.off{opacity:.28}
  #orb .power{position:absolute;inset:0;display:grid;place-items:center;color:rgba(0,0,0,.5)}
  #orb .power svg{width:30%;height:30%}

  .state{text-align:center}
  .state .cname{font-size:2.6rem;font-weight:750;letter-spacing:-.045em;line-height:1}
  .state p{margin-top:8px;font-size:.92rem;color:var(--muted)}
  .state p b{color:var(--text);font-weight:600}

  /* Bedieningsdok */
  .dock{border-radius:28px;padding:16px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column;gap:14px}
  .row-label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;white-space:nowrap;font-size:.75rem;font-weight:650;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 4px}
  .row-label span:last-child{letter-spacing:.02em;text-transform:none;font-weight:500;font-size:.78rem}
  .swatches{display:flex;justify-content:space-between;padding:0 2px}
  .sw{width:max(44px,min(50px,12.4vw));aspect-ratio:1;border-radius:50%;background:var(--s);position:relative;
    box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;transition:transform .35s var(--ease), box-shadow .35s var(--ease)}
  .sw::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--s);
    opacity:0;transform:scale(.8);transition:opacity .35s var(--ease), transform .35s var(--ease)}
  .sw[aria-pressed="true"]{box-shadow:0 0 24px color-mix(in srgb,var(--s) 70%,transparent)}
  .sw[aria-pressed="true"]::after{opacity:1;transform:scale(1)}
  .sw:active{transform:scale(.9)}
  .sw.disco{background:conic-gradient(from 0deg,#FFE600,#00FF5A,#00E5FF,#8B5CFF,#FF2BD6,#FF8A00,#FFE600)}
  .sw.disco[aria-pressed="true"]{animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(1turn)}}
  /* Disco in vast ritme: zacht overvloeien van kleur naar kleur */
  body.lit.fade #light{transition:background 1.1s linear, clip-path .7s var(--ease), visibility 0s}
  .seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:999px;
    background:rgba(0,0,0,.35);border:1px solid var(--line)}
  .seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:999px;
    background:var(--glass-2);box-shadow:0 1px 0 rgba(255,255,255,.1) inset;transition:transform .45s var(--ease)}
  .seg button{position:relative;height:44px;display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:.9rem;font-weight:600;color:var(--muted);transition:color .3s}
  .seg button[aria-pressed="true"]{color:var(--text)}
  .seg svg{width:22px;height:10px}

  /* Onderblad (uitleg & installeren) */
  dialog{margin:auto auto 0;width:100%;max-width:460px;border:0;color:var(--text);background:#12141b;
    border-radius:28px 28px 0 0;padding:10px 22px calc(24px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);transform:translateY(100%);transition:transform .45s var(--ease)}
  dialog[open].in{transform:translateY(0)}
  dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 18px}
  dialog h2{font-size:1.4rem;font-weight:700;letter-spacing:-.03em;margin-bottom:6px}
  dialog .lead{color:var(--muted);font-size:.92rem;line-height:1.5;margin-bottom:18px}
  .steps{list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
  .steps li{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--glass);
    font-size:.92rem;line-height:1.45;counter-increment:s}
  .steps.num li::before{content:counter(s);flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;
    background:var(--c);color:#000;font-weight:700;font-size:.8rem}
  .steps li strong{font-weight:650}
  .steps .ic{display:inline-flex;vertical-align:-3px;width:18px;height:18px}
  .big{width:100%;height:56px;border-radius:18px;background:var(--c);color:#000;font-weight:700;font-size:1.05rem;
    margin-top:18px;box-shadow:0 0 30px -6px var(--c)}
  .ghost{width:100%;height:48px;border-radius:16px;margin-top:10px;color:var(--muted);font-weight:600}

  /* ---------- Licht ---------- */
  #light{position:fixed;inset:0;z-index:10;background:var(--c);visibility:hidden;
    clip-path:circle(0 at var(--ox,50%) var(--oy,40%));
    transition:clip-path .7s var(--ease), visibility 0s .7s;touch-action:none;user-select:none;-webkit-user-select:none}
  body.lit #light{visibility:visible;clip-path:circle(150% at var(--ox,50%) var(--oy,40%));
    transition:clip-path .7s var(--ease), visibility 0s}
  /* Knipperen = een zwarte laag aan/uit (alleen opacity): de gsm hoeft het volle scherm niet opnieuw te schilderen */
  #light::after{content:"";position:absolute;inset:0;background:#000;opacity:0;will-change:opacity}
  #light.dark::after{opacity:1}
  /* Terwijl het licht brandt, staan de bol en zijn ringen onzichtbaar achter het licht: dan ook niet animeren */
  body.lit .orbwrap::before,body.lit .orbwrap::after,body.lit .sw.disco[aria-pressed="true"]{animation:none}

  /* Uitknop: op exact dezelfde plek als de aanknop; vasthouden om te doven */
  #off{position:fixed;z-index:11;left:var(--ox,50%);top:var(--oy,40%);width:96px;height:96px;
    transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;border-radius:50%;
    background:rgba(0,0,0,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    transition:transform .5s var(--ease), opacity .5s var(--ease), visibility 0s .5s;visibility:hidden}
  body.lit #off{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;visibility:visible;transition:transform .5s var(--ease) .4s, opacity .5s var(--ease) .4s, visibility 0s}
  #off:focus-visible{outline:3px solid #000;outline-offset:3px;box-shadow:0 0 0 3px #fff}   /* wit en zwart: zichtbaar op elke lichtkleur */
  body.lit #off.dim{opacity:.4;transition-delay:0s}
  #off.holding{transform:translate(-50%,-50%) scale(1.08)!important;opacity:1!important}
  #off .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  #off .track{stroke:rgba(255,255,255,.18)}
  #off .prog{stroke:#fff;stroke-dasharray:289;stroke-dashoffset:289}
  #off.holding .prog{stroke-dashoffset:0;transition:stroke-dashoffset .6s linear}
  #off .ico{position:absolute;inset:0;display:grid;place-items:center}
  #off .ico svg{width:38px;height:38px}
  #warn{position:fixed;z-index:12;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));max-width:420px;margin:0 auto;
    padding:14px 16px;border-radius:18px;background:rgba(0,0,0,.82);color:#fff;font-size:.88rem;line-height:1.45;
    opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .4s var(--ease), transform .4s var(--ease)}
  body.lit #warn.show{opacity:1;transform:none}
  #offtxt{position:fixed;z-index:11;left:var(--ox,50%);top:calc(var(--oy,40%) + 66px);transform:translateX(-50%);
    padding:7px 14px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:.85rem;font-weight:600;
    white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .5s var(--ease)}
  body.lit #offtxt.show{opacity:1}

  @media (orientation:landscape) and (max-height:520px){
    #app{max-width:860px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;column-gap:24px}
    .top{grid-column:1/-1}
    .stage{gap:12px}
    .orbwrap{width:min(26vw,46vh,220px)}
    .state .cname{font-size:1.8rem}
    .dock{align-self:center}
  }
  @media (max-height:700px){ .state .cname{font-size:2.1rem} .stage{gap:16px} }
  @media (max-width:359px){ #app{padding-left:12px;padding-right:12px} .dock{padding:14px 12px} .swatches{padding:0} }
  .ghost.reset{height:44px;margin-top:4px;font-size:.88rem;font-weight:500}
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms!important} .orbwrap::before,.orbwrap::after{animation:none} .sw.disco[aria-pressed="true"]{animation:none} }
  /* Hoog contrast: kleuren blijven zichtbaar, de keuze krijgt een dikke rand en een vinkje */
  @media (forced-colors:active){
    .sw{forced-color-adjust:none;border:1px solid CanvasText}
    .sw[aria-pressed="true"]{outline:3px solid Highlight;outline-offset:4px}
    .sw::after{display:none}
    .seg .pill{display:none}
    .seg button{border:1px solid ButtonText;border-radius:999px}
    .seg button[aria-pressed="true"]{border:3px solid Highlight}
    .seg button[aria-pressed="true"]::before{content:"\2713"}
    :focus-visible{outline:3px solid Highlight}
  }

/* Soepel op gsm: geen tikvertraging, zichtbare tikfeedback, vensters scrollen de pagina niet mee */
a, button, summary, select, label, [role="button"], [role="tab"] { touch-action: manipulation; }
button:not(:disabled):active, summary:active, [role="button"]:active { filter: brightness(0.93); }
dialog, [role="dialog"], [role="alertdialog"], .modal, .modal-backdrop { overscroll-behavior: contain; }
/* Eenheid met de andere tools: bovenbalk 56 px hoog (knoppen op 6 px van de rand), terugknop zoals elders: 14 px, pijl met 8 px ruimte (licht op het donkere scherm) */
.top{min-height:56px;margin-top:-14px}
.crumb{gap:.5rem;font-size:.875rem}
</style>
</head>
<body>

<div id="app">
  <div class="top">
    <a class="crumb" href="../" aria-label="Terug naar Zakmes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Zakmes</a>
    <h1 class="sr">Looplicht</h1>
    <span class="sp"></span>
    <button class="chip" id="installChip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Installeer</button>
    <button class="chip icon" id="infoChip" aria-label="Tips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
  </div>

  <section class="stage">
    <div class="orbwrap"><span class="glow"></span>
      <button id="orb" aria-label="Licht aanzetten">
        <span class="power"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 7.2a7.5 7.5 0 1 0 11.4 0"/></svg></span>
      </button>
    </div>
    <div class="state">
      <p class="cname" id="cname">Geel</p>
      <p><b id="mname">Knipper</b> · tik op de bol om te starten</p>
    </div>
  </section>

  <section class="dock">
    <div class="row-label"><span>Kleur</span><span id="cnote"></span></div>
    <div class="swatches" id="swatches" role="group" aria-label="Kleur"></div>
    <div class="row-label"><span>Ritme</span><span id="mnote"></span></div>
    <div class="seg" id="modes" role="group" aria-label="Ritme">
      <span class="pill"></span>
      <button data-mode="vast"><svg viewBox="0 0 22 10"><rect x="1" y="3" width="20" height="4" rx="2" fill="currentColor"/></svg>Vast</button>
      <button data-mode="knipper"><svg viewBox="0 0 22 10"><rect x="1" y="3" width="6" height="4" rx="2" fill="currentColor"/><rect x="15" y="3" width="6" height="4" rx="2" fill="currentColor"/></svg>Knipper</button>
      <button data-mode="flits"><svg viewBox="0 0 22 10"><rect x="1" y="3" width="3" height="4" rx="1.5" fill="currentColor"/><rect x="6" y="3" width="3" height="4" rx="1.5" fill="currentColor"/><rect x="18" y="3" width="3" height="4" rx="1.5" fill="currentColor"/></svg>Flits</button>
    </div>
  </section>
</div>

<dialog id="sheet"><div class="grab"></div><div id="sheetBody"></div></dialog>

<div id="light" aria-hidden="true"></div>
<button id="off" aria-label="Houd vast om het licht te doven">
  <svg class="ring" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46" fill="none" stroke-width="4"/><circle class="prog" cx="50" cy="50" r="46" fill="none" stroke-width="4" stroke-linecap="round"/></svg>
  <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 7.2a7.5 7.5 0 1 0 11.4 0"/></svg></span>
</button>
<div id="offtxt">Vasthouden om te doven</div>
<div id="warn" role="status"><strong>Let op:</strong> je browser kan het scherm niet wakker houden. Zet de automatische schermvergrendeling tijdelijk langer, anders gaat het licht vanzelf uit.</div>

<script>
const COLORS = [
  {id:'wit',    hex:'#FFFFFF', name:'Wit',    note:'vooraan · het felst'},
  {id:'geel',   hex:'#FFE600', name:'Geel',   note:'vooraan · bijna zo fel als wit'},
  {id:'groen',  hex:'#00FF5A', name:'Groen',  note:'fel · valt op door ongewoon'},
  {id:'oranje', hex:'#FF8A00', name:'Oranje', note:'signaalkleur · iets minder fel'},
  {id:'rood',   hex:'#FF1F1F', name:'Rood',   note:'achteraan · liefst knipperend'},
  {id:'disco',  hex:'#FFE600', name:'Disco',  note:'voor de fun · minder duidelijk'}
];
const MODES = {
  vast:    {name:'Vast',    note:'continu licht'},
  knipper: {name:'Knipper', note:'2× per seconde'},
  flits:   {name:'Flits',   note:'dubbelflits · valt het meest op'}
};
// Patronen in ms [aan, uit, ...]. Nooit sneller dan 3 flitsen per seconde (veilig bij flitsgevoeligheid).
const PATTERNS = {knipper:[300,200], flits:[110,140,110,640]};

const store={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let color=store.get('ll-color','geel'), mode=store.get('ll-mode', reduce?'vast':'knipper');
const $=s=>document.querySelector(s), root=document.documentElement, body=document.body;
const tick=()=>{try{navigator.vibrate?.(8)}catch(e){}};

// ---- Disco ----
// Geen rood in de reeks: snelle rode wissels zijn het riskantst bij flitsgevoeligheid, en rood vooraan verwart bestuurders.
const DISCO=['#FFE600','#00FF5A','#00E5FF','#FF2BD6','#FF8A00','#8B5CFF'];
let di=0, discoT=null;
const isDisco=()=>color==='disco';
function discoNext(){ di=(di+1)%DISCO.length; root.style.setProperty('--c',DISCO[di]); }
function discoCycle(ms){ clearInterval(discoT); discoT=setInterval(discoNext,ms); }
function discoStop(){ clearInterval(discoT); body.classList.remove('fade'); }
function discoIdle(){ if(isDisco() && !body.classList.contains('lit')) discoCycle(reduce?4000:1600); }

// ---- Kleur ----
const sw=$('#swatches');
COLORS.forEach(c=>{const b=document.createElement('button');b.className='sw'+(c.id==='disco'?' disco':'');b.style.setProperty('--s',c.id==='disco'?'#FF2BD6':c.hex);
  b.dataset.id=c.id;b.setAttribute('aria-label',c.name);b.onclick=()=>{tick();setColor(c.id);};sw.appendChild(b);});
function setColor(id){
  const c=COLORS.find(x=>x.id===id)||COLORS[1]; color=c.id; store.set('ll-color',c.id);
  discoStop();
  root.style.setProperty('--c', c.id==='disco' ? DISCO[di] : c.hex);
  discoIdle();
  sw.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===c.id));
  $('#cname').textContent=c.name; $('#cnote').textContent=c.note;
}
// ---- Ritme ----
const btns=[...document.querySelectorAll('#modes button')];
btns.forEach(b=>b.onclick=()=>{tick();setMode(b.dataset.mode);});
function setMode(m){
  if(!MODES[m]) m='knipper'; mode=m; store.set('ll-mode',m);
  btns.forEach((b,i)=>{const on=b.dataset.mode===m;b.setAttribute('aria-pressed',on);
    if(on)$('#modes .pill').style.transform=`translateX(${i*100}%)`;});
  $('#mname').textContent=MODES[m].name; $('#mnote').textContent=MODES[m].note;
  preview();
}

// ---- Alles wissen: eigen sleutels weg, standaardkleur en -ritme terug ----
function resetAll(){
  setColor('geel'); setMode(reduce?'vast':'knipper');
  ['ll-color','ll-mode'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
}

// ---- Patroonmotor (zelfde voor voorbeeld en licht) ----
let timer=null;
function play(el){
  clearTimeout(timer); el.classList.remove('off','dark');
  const p=PATTERNS[mode]; if(!p) return;
  let i=0; const cls=el.id==='orb'?'off':'dark';
  const step=()=>{ if(i%2===0 && i>0 && isDisco()) discoNext();
    el.classList.toggle(cls,i%2===1);timer=setTimeout(()=>{i=(i+1)%p.length; if(i===0&&isDisco()) discoNext(); step();},p[i]);};
  step();
}
let previewT=null;
function preview(){
  if(body.classList.contains('lit')) return;
  const orb=$('#orb'); clearTimeout(previewT);
  if(reduce){ clearTimeout(timer); orb.classList.remove('off'); return; }
  clearInterval(discoT); play(orb);                 // toon het ritme even…
  previewT=setTimeout(()=>{ if(!body.classList.contains('lit')){ clearTimeout(timer); orb.classList.remove('off'); discoIdle(); } },2600);  // …en daarna rustig
}
setColor(color); setMode(mode); clearTimeout(previewT); clearTimeout(timer); $('#orb').classList.remove('off');

// ---- Aan ----
const light=$('#light'); let wakeLock=null, dimT=null;
async function lockWake(){
  let ok=false;
  try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); ok=true; } }catch(e){}
  const w=$('#warn'); if(!ok && body.classList.contains('lit')){ w.classList.add('show'); setTimeout(()=>w.classList.remove('show'),7000); }
}
// Volledig scherm verbergt adres- en statusbalk: de pagina schuift dan omhoog.
// We schuiven de uitknop even ver mee, zodat hij op het scherm exact blijft waar de bol stond.
let ox=0, oy=0, h0=0;
function place(){ root.style.setProperty('--ox',ox+'px'); root.style.setProperty('--oy',(oy+(innerHeight-h0))+'px'); }
addEventListener('resize',()=>{ if(body.classList.contains('lit')) place(); });
async function start(){
  const r=$('#orb').getBoundingClientRect();
  ox=r.left+r.width/2; oy=r.top+r.height/2; h0=innerHeight; place();
  clearTimeout(timer); clearTimeout(previewT); $('#orb').classList.remove('off');
  discoStop();
  const kb=document.activeElement===$('#orb') && $('#orb').matches(':focus-visible');
  body.classList.add('lit');
  if(kb) requestAnimationFrame(()=>$('#off').focus({preventScroll:true}));   // de bol verdwijnt: de focus gaat mee naar de uitknop
  if(isDisco() && !PATTERNS[mode]){ body.classList.add('fade'); discoCycle(1200); }
  history.pushState({lit:1},'');             // terug-knop of -veeg dooft het licht
  try{await (root.requestFullscreen?.({navigationUI:'hide'})||root.webkitRequestFullscreen?.());}catch(e){}
  await lockWake();
  setTimeout(()=>{ if(body.classList.contains('lit')) play(light); },700);
  dim();
}
function dim(){ const o=$('#off'),t=$('#offtxt'); o.classList.remove('dim'); t.classList.add('show'); clearTimeout(dimT);
  dimT=setTimeout(()=>{o.classList.add('dim');t.classList.remove('show');},4000); }

// ---- Uit ----
function stop(fromBack){
  if(!body.classList.contains('lit')) return;
  clearTimeout(timer); light.classList.remove('dark');
  const kb=document.activeElement===$('#off');
  body.classList.remove('lit'); $('#warn').classList.remove('show');
  if(kb) $('#orb').focus({preventScroll:true});
  discoStop(); setTimeout(discoIdle,700);
  try{wakeLock?.release();}catch(e){} wakeLock=null;
  try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}
  if(!fromBack && history.state?.lit) history.back();
}
// Na het doven valt de 'klik' van het loslaten op de aanknop eronder: die negeren we even.
let quietUntil=0;
$('#orb').onclick=()=>{ if(Date.now()<quietUntil) return; start(); };
addEventListener('popstate',()=>stop(true));
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&body.classList.contains('lit'))stop();});
addEventListener('keydown',e=>{if(e.key==='Escape')stop();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&body.classList.contains('lit'))lockWake();});

// Vasthouden (0,6 s) om te doven; loslaten annuleert. De vinger mag wat verschuiven.
const off=$('#off'); let holdT=null;
off.addEventListener('pointerdown',e=>{e.preventDefault();dim();off.classList.add('holding');
  try{off.setPointerCapture(e.pointerId);}catch(_){}
  $('#offtxt').textContent='Blijf vasthouden…';
  holdT=setTimeout(()=>{off.classList.remove('holding');quietUntil=Date.now()+600;stop();try{navigator.vibrate?.(30)}catch(_){}},600);});
['pointerup','pointercancel'].forEach(ev=>off.addEventListener(ev,()=>{
  clearTimeout(holdT);off.classList.remove('holding');$('#offtxt').textContent='Vasthouden om te doven';}));
off.addEventListener('contextmenu',e=>e.preventDefault());
// Toetsenbord: Enter of spatie op de uitknop dooft meteen (vasthouden kan daar niet). Met de muis of vinger blijft vasthouden nodig.
off.addEventListener('click',e=>{ if(e.detail===0) stop(); });
light.addEventListener('pointerdown',dim);   // tik op het licht: uitknop even goed zichtbaar
